name: Flatpak validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Search regression tests
        run: python3 -m unittest -v test_udfarama.py
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils xvfb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//50 org.gnome.Platform//50 org.flatpak.Builder
      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/com.adalettekno.UdfArama.desktop
          appstreamcli validate --no-net data/com.adalettekno.UdfArama.metainfo.xml
      - name: Build and install Flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --install --repo=repo build-dir com.adalettekno.UdfArama.yml
      - name: Validate exported package
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
      - name: Open packaged GTK window on virtual display
        run: |
          xvfb-run -a flatpak run --socket=x11 --nosocket=wayland --command=python3 com.adalettekno.UdfArama - <<'PY'
          from pathlib import Path
          source = Path('/app/bin/udfarama').read_text()
          namespace = {}
          exec(compile(source.rsplit('\napp = UdfAramaApp()', 1)[0], '/app/bin/udfarama', 'exec'), namespace)
          Gtk, GLib = namespace['Gtk'], namespace['GLib']
          app = namespace['UdfAramaApp']()
          activated = []
          def verify(application):
              window = application.get_active_window()
              assert window is not None
              assert window.search_button.get_sensitive()
              activated.append(True)
              GLib.timeout_add(500, application.quit)
          app.connect_after('activate', verify)
          GLib.timeout_add_seconds(10, app.quit)
          assert app.run([]) == 0
          assert activated, 'Application window did not activate'
          print('Packaged GTK window opened successfully')
          PY
      - name: Create test bundle
        run: flatpak build-bundle repo UdfArama.flatpak com.adalettekno.UdfArama
      - uses: actions/upload-artifact@v4
        with:
          name: UdfArama-test-bundle
          path: UdfArama.flatpak
