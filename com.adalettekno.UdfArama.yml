id: com.adalettekno.UdfArama
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: udfarama
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --filesystem=host
modules:
  - name: udfarama
    buildsystem: simple
    build-commands:
      - install -D bin/udfarama /app/bin/udfarama
      - install -D share/applications/com.adalettekno.UdfArama.desktop /app/share/applications/com.adalettekno.UdfArama.desktop
      - install -D share/icons/hicolor/256x256/apps/udfarama.png /app/share/icons/hicolor/256x256/apps/com.adalettekno.UdfArama.png
