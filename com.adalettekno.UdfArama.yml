app-id: com.adalettekno.UdfArama
runtime: org.freedesktop.Platform
runtime-version: '24.08' # Flathub'ın en kararlı ve tüm Linux sürümleriyle uyumlu ana tabanı
sdk: org.freedesktop.Sdk # Doğru derleme araç paketi
command: udfarama
finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --filesystem=host:ro # Kullanıcının UDF dosyalarını seçebilmesi için ana makineyi okuma izni
  - --talk-name=org.freedesktop.portal.Desktop # Tarayıcı ve harici dosya tetikleme portal izni
modules:
  - name: udfarama
    buildsystem: simple
    build-commands:
      # Çekirdek script kurulumu
      - install -D bin/udfarama /app/bin/udfarama
      
      # Masaüstü kısayol kurulumu
      - install -D share/applications/com.adalettekno.UdfArama.desktop /app/share/applications/com.adalettekno.UdfArama.desktop
      
      # Mağaza meta veri (metainfo) kurulumu (Flathub için ZORUNLUDUR)
      - install -D share/metainfo/com.adalettekno.UdfArama.metainfo.xml /app/share/metainfo/com.adalettekno.UdfArama.metainfo.xml
      
      # İkon kurulumu (Uzantı ve dizin yapısı Linux standartlarına eşitlendi)
      - install -D share/icons/hicolor/256x256/apps/udfarama.png /app/share/icons/hicolor/256x256/apps/com.adalettekno.UdfArama.png
    sources:
      - type: dir
        path: .
